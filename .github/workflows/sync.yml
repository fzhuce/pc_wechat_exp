name: 定时同步上游仓库与 Releases
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 9 * * 1'  # 每周一9点同步 
  workflow_dispatch:      # 支持手动触发

jobs:
  sync_code_and_releases:
    runs-on: ubuntu-latest
    steps:
      # ========== 第一部分：同步代码分支 ==========
      - name: 检出自己仓库的代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 备份工作流文件
        run: |
          mkdir -p /tmp/workflow
          cp .github/workflows/sync.yml /tmp/workflow/sync.yml

      - name: 配置 Git
        run: |
          git config --global user.name "fzhuce"
          git config --global user.email "fzhuce@126.com"
          git config --global core.quotepath false

      - name: 添加上游仓库并拉取 main 分支
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/sunhanaix/pc_wechat_exp.git
          git fetch upstream main
          git rev-parse upstream/main

      - name: 重置为上游状态
        run: |
          git checkout main
          git reset --hard upstream/main

      - name: 恢复工作流文件
        run: |
          mkdir -p .github/workflows
          cp /tmp/workflow/sync.yml .github/workflows/sync.yml
          git add .github/workflows/sync.yml

      - name: 配置推送 URL（使用 PAT）
        run: |
          git remote set-url origin https://${{ secrets.SYNC_TOKEN }}@github.com/fzhuce/pc_wechat_exp.git

      - name: 提交并推送到 origin
        run: |
          git commit -m "sync upstream code + restore workflow" || echo "No changes to commit"
          git push -f origin main

      # ========== 第二部分：同步上游 Releases ==========
      - name: 同步上游 Releases 及其附件
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const sourceOwner = 'sunhanaix';
            const sourceRepo = 'pc_wechat_exp';
            const targetOwner = 'fzhuce';
            const targetRepo = 'pc_wechat_exp';

            // 1. 获取上游所有 Releases
            const { data: releases } = await github.rest.repos.listReleases({
              owner: sourceOwner,
              repo: sourceRepo,
              per_page: 100
            });

            console.log(`Found ${releases.length} releases in upstream`);

            // 2. 遍历并同步每个 Release
            for (const release of releases) {
              console.log(`Processing release: ${release.tag_name}`);

              // 检查目标仓库是否已有该 Release
              let targetRelease;
              try {
                const { data: tr } = await github.rest.repos.getReleaseByTag({
                  owner: targetOwner,
                  repo: targetRepo,
                  tag: release.tag_name
                });
                targetRelease = tr;
              } catch (e) {
                // 不存在则创建
                console.log(`Creating new release: ${release.tag_name}`);
                const { data: newRelease } = await github.rest.repos.createRelease({
                  owner: targetOwner,
                  repo: targetRepo,
                  tag_name: release.tag_name,
                  name: release.name,
                  body: release.body,
                  draft: release.draft,
                  prerelease: release.prerelease,
                  target_commitish: release.target_commitish
                });
                targetRelease = newRelease;
              }

              // 3. 同步附件
              console.log(`Found ${release.assets.length} assets`);
              for (const asset of release.assets) {
                console.log(`Processing asset: ${asset.name}`);
                // 先删除目标仓库中同名的旧附件
                try {
                  const targetAssets = await github.rest.repos.listReleaseAssets({
                    owner: targetOwner,
                    repo: targetRepo,
                    release_id: targetRelease.id,
                    per_page: 100
                  });
                  for (const ta of targetAssets.data) {
                    if (ta.name === asset.name) {
                      await github.rest.repos.deleteReleaseAsset({
                        owner: targetOwner,
                        repo: targetRepo,
                        asset_id: ta.id
                      });
                      console.log(`Deleted old asset: ${ta.name}`);
                    }
                  }
                } catch (e) {
                  console.log(`No old assets found for ${asset.name}`);
                }

                // 下载上游附件并上传到目标仓库
                const response = await fetch(asset.browser_download_url);
                const buffer = await response.arrayBuffer();
                await github.rest.repos.uploadReleaseAsset({
                  owner: targetOwner,
                  repo: targetRepo,
                  release_id: targetRelease.id,
                  name: asset.name,
                  data: Buffer.from(buffer),
                  headers: {
                    'content-type': asset.content_type
                  }
                });
                console.log(`Uploaded asset: ${asset.name}`);
              }
            }
